# Publishes to npm when a version tag (v1.2.3) is pushed, through npm trusted
# publishing: npm trusts this workflow, so no npm token is stored anywhere.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # npm trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: npm install -g npm@latest
      - run: npm publish
